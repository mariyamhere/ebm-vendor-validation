<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendor Validation System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #343579;
  --navy-deep: #28316a;
  --sky: #4ec3ec;
  --sky-soft: #eef8fd;
  --ink: #212529;
  --body: #4b4747;
  --muted: #7d7878;
  --line: #ece7e3;
  --warm: #f7f4f2;
  --good: #18604d;
  --good-soft: #dafcf5;
  --check: #7a5b00;
  --check-soft: #fff4c7;
  --no: #c42e1c;
  --no-soft: #fdeeec;
  --font: "Figtree", "Euclid Circular A", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #fff; color: var(--ink); font: 400 18px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--navy); }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; border-radius: 8px; }

header { border-bottom: 1px solid var(--line); }
.bar { max-width: 720px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; gap: 14px; }
.home { display: flex; align-items: center; gap: 12px; color: var(--navy); background: none; border: 0; padding: 0; cursor: pointer; }
.home b { font-size: 24px; letter-spacing: .02em; }
.home i { width: 1.5px; height: 28px; background: var(--navy); }
.home span { font-size: 18px; font-weight: 600; white-space: nowrap; text-align: left; }
.settings { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; }

main { max-width: 720px; margin: 0 auto; padding: 48px 24px 96px; }
h1 { font-size: 40px; line-height: 1.15; font-weight: 700; color: var(--navy); margin: 0; letter-spacing: -.02em; }
.subhead { font-size: 26px; line-height: 1.3; font-weight: 600; color: var(--ink); margin: 18px 0 0; }
.lead { font-size: 20px; color: var(--body); margin: 8px 0 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border-radius: 999px; padding: 16px 32px; font-weight: 600; font-size: 19px; cursor: pointer; border: 2px solid var(--navy); background: var(--navy); color: #fff; }
.btn:hover { background: var(--navy-deep); }
.btn.light { background: #fff; color: var(--navy); }
.btn.light:hover { background: var(--sky-soft); }
.btn:disabled { opacity: .5; cursor: progress; }
.link { background: none; border: 0; padding: 0; color: var(--navy); font-weight: 600; cursor: pointer; font-size: 17px; text-decoration: underline; text-underline-offset: 4px; }
.link.grey { color: var(--muted); font-weight: 500; }

.label { display: inline-block; font-size: 15px; font-weight: 700; padding: 4px 14px; border-radius: 999px; white-space: nowrap; }
.label.good { background: var(--good-soft); color: var(--good); }
.label.check { background: var(--check-soft); color: var(--check); }
.label.no { background: var(--no-soft); color: var(--no); }
.label.done { background: var(--warm); color: var(--body); }

/* ---------- home ---------- */
.start { margin-top: 32px; }
.list { margin-top: 48px; }
.card { display: block; width: 100%; text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: 20px 24px; cursor: pointer; margin-bottom: 14px; }
.card:hover { border-color: var(--navy); }
.card .top { display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
.card .name { font-size: 21px; font-weight: 600; color: var(--navy); }
.card .why { margin-top: 6px; color: var(--body); font-size: 17px; }
.foot { margin-top: 36px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.note-sample { font-size: 16px; color: var(--muted); }

/* ---------- review ---------- */
.crumbs { display: flex; justify-content: space-between; align-items: center; font-size: 17px; color: var(--muted); }
.steps { display: flex; gap: 8px; margin: 28px 0 40px; }
.steps button { flex: 1; text-align: left; background: none; border: 0; border-top: 5px solid var(--line); padding: 10px 0 0; cursor: pointer; font-size: 17px; color: var(--muted); }
.steps button.past { border-color: #b7dff0; color: var(--body); }
.steps button.now { border-color: var(--navy); color: var(--navy); font-weight: 700; }
.name-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
.what-they-do { font-size: 19px; color: var(--body); margin-top: 8px; }
.box { margin-top: 28px; padding: 26px 28px; border-radius: 20px; background: var(--sky-soft); }
.box.no { background: var(--no-soft); }
.box h2 { font-size: 22px; margin: 0 0 8px; color: var(--navy); }
.box.no h2 { color: var(--no); }
.box p { margin: 0; font-size: 19px; }
.box ul { margin: 0; padding-left: 22px; font-size: 19px; }
.score-line { margin-top: 28px; font-size: 19px; color: var(--body); }
.score-line b { font-size: 34px; color: var(--navy); }
.actions { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; margin-top: 40px; }

h2.sec { font-size: 24px; color: var(--navy); margin: 0 0 14px; }
.sec-wrap + .sec-wrap { margin-top: 44px; }
.check-list { margin: 0; padding: 0; list-style: none; }
.check-list li { padding: 14px 0; border-top: 1px solid var(--line); font-size: 18px; }
.check-list li:last-child { border-bottom: 1px solid var(--line); }
.mark { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
.mark .t { font-weight: 600; }
.mark .w { font-weight: 700; font-size: 16px; white-space: nowrap; }
.mark .w.good { color: var(--good); }
.mark .w.ok { color: var(--check); }
.mark .w.weak { color: var(--no); }
.small { font-size: 16px; color: var(--body); margin-top: 2px; }
details summary { cursor: pointer; font-size: 19px; font-weight: 600; color: var(--navy); }
dl { margin: 16px 0 0; }
dt { font-size: 16px; color: var(--muted); margin-top: 12px; }
dd { margin: 0; white-space: pre-line; }

.choices { display: grid; gap: 14px; }
.choice { display: flex; gap: 16px; align-items: center; width: 100%; text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: 20px 22px; cursor: pointer; }
.choice:hover { border-color: #b7dff0; }
.choice .dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #cfc8c3; flex: none; }
.choice[aria-checked="true"] { border-color: var(--navy); background: var(--sky-soft); }
.choice[aria-checked="true"] .dot { border: 8px solid var(--navy); }
.choice .t { font-size: 20px; font-weight: 600; display: block; }
.choice .d { font-size: 16px; color: var(--body); }
.ours { font-size: 14px; font-weight: 700; color: var(--good); background: var(--good-soft); padding: 2px 10px; border-radius: 999px; margin-left: 8px; vertical-align: 2px; }
.write { margin-top: 30px; }
.write label { display: block; font-size: 20px; font-weight: 600; }
.write .hint { font-size: 16px; color: var(--muted); margin: 2px 0 10px; }
.write textarea { width: 100%; min-height: 140px; border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; resize: vertical; font-size: 18px; }
.write textarea:focus { border-color: var(--navy); outline: none; }
.tick { display: flex; gap: 10px; align-items: center; margin-top: 14px; font-size: 17px; }
.tick input { width: 22px; height: 22px; accent-color: var(--navy); }
.err { color: var(--no); font-size: 17px; margin-top: 14px; font-weight: 500; }
.decided { padding: 26px 28px; border-radius: 20px; background: var(--warm); font-size: 19px; }

.site-foot { border-top: 1px solid var(--line); text-align: center; color: var(--muted); font-size: 15px; padding: 22px 16px 28px; }

dialog { border: 0; border-radius: 22px; padding: 30px; width: min(480px, calc(100vw - 32px)); box-shadow: 0 24px 60px -20px rgba(40,49,106,.45); }
dialog::backdrop { background: rgba(40,49,106,.3); }
dialog h2 { font-size: 24px; color: var(--navy); margin: 0 0 6px; }
dialog p { margin: 0 0 6px; color: var(--body); font-size: 17px; }
dialog label { display: block; font-size: 16px; font-weight: 600; margin: 16px 0 6px; }
dialog input { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 11px 14px; font-size: 17px; }
dialog .btns { display: flex; justify-content: flex-end; gap: 20px; align-items: center; margin-top: 26px; }

.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0; background: var(--navy); color: #fff; padding: 16px 26px; border-radius: 16px; font-size: 18px; transition: .25s; pointer-events: none; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 640px) {
  body { font-size: 17px; }
  main { padding: 32px 18px 80px; }
  .bar { padding: 14px 18px; }
  .home { gap: 8px; }
  .home b { font-size: 19px; }
  .home span { font-size: 15px; }
  .home svg { width: 24px; }
  h1 { font-size: 31px; }
  .lead { font-size: 18px; }
  .subhead { font-size: 22px; }
  .btn { width: 100%; }
  .box { padding: 20px; }
  .steps button { font-size: 15px; }
  .toast { left: 16px; right: 16px; transform: translateY(20px); max-width: none; }
  .toast.show { transform: none; }
}
</style>

const waiting = () => state.vendors.filter(v => v.status === 'pending_review')
  .sort((a, b) => ORDER[verdict(a).cls] - ORDER[verdict(b).cls] || (b.score ?? -1) - (a.score ?? -1));

/* ======================================================================
   Home
   ====================================================================== */
function renderHome() {
  const list = waiting();
  const done = state.vendors.filter(v => v.status !== 'pending_review');
  const card = v => {
    const vd = verdict(v);
    return `<button class="card" type="button" data-open="${esc(v.vendor_id)}">
      <span class="top"><span class="name">${esc(v.company_name)}</span><span class="label ${vd.cls}">${vd.text}</span></span>
      <span class="why" style="display:block">${esc(oneLine(v))}</span>
    </button>`;
  };

  app.innerHTML = list.length ? `
    <h1>Vendor Validation System</h1>
    <h2 class="subhead">${list.length} supplier${list.length > 1 ? 's are' : ' is'} waiting for your decision</h2>
    <p class="lead">We have checked each one for you. Go through them one by one.</p>
    <div class="start"><button class="btn" type="button" data-open="${esc(list[0].vendor_id)}">Start →</button></div>
    <div class="list">${list.map(card).join('')}</div>
    <div class="foot">
      ${done.length ? `<button class="link grey" type="button" data-toggle-done>${state.showDone ? 'Hide' : 'Show'} the ${done.length} you have already decided</button>` : ''}
      ${state.showDone ? `<div style="width:100%">${done.map(card).join('')}</div>` : ''}
      ${state.demo ? '<span class="note-sample">You are looking at practice data.</span>' : ''}
    </div>`
  : `
    <h1>Vendor Validation System</h1>
    <h2 class="subhead">All done</h2>
    <p class="lead">No suppliers are waiting. New ones will appear here after they fill in our form.</p>
    <div class="foot">
      ${done.length ? `<button class="link grey" type="button" data-toggle-done>${state.showDone ? 'Hide' : 'Show'} the ${done.length} you have decided</button>` : ''}
      ${state.showDone ? `<div style="width:100%">${done.map(card).join('')}</div>` : ''}
    </div>`;
}

/* ======================================================================
   Review: 1 Summary → 2 Details → 3 Your decision
   ====================================================================== */
function renderReview() {
  const v = state.vendors.find(x => x.vendor_id === state.id);
  if (!v) return go('home');
  const left = waiting().length;
  const steps = ['1. Summary', '2. Details', '3. Your decision'];
  const vd = verdict(v);
  app.innerHTML = `
    <div class="crumbs"><button class="link" type="button" data-home>← Back</button>
      <span>${v.status === 'pending_review' ? `${left} waiting` : ''}</span></div>
    <div class="steps">${steps.map((s, i) => `<button type="button" data-step="${i + 1}" class="${state.step === i + 1 ? 'now' : state.step > i + 1 ? 'past' : ''}">${s}</button>`).join('')}</div>
    <div class="name-row"><h1>${esc(v.company_name)}</h1><span class="label ${vd.cls}">${vd.text}</span></div>
    <div class="what-they-do">${esc(v.category)} from ${esc(v.city)}, in business for ${esc(v.years_in_business)} years</div>
    ${[summary, details, decide][state.step - 1](v)}`;
}

function summary(v) {
  return `
    ${v.blocked ? `<div class="box no"><h2>Why this supplier is not allowed</h2>
      ${v.knockouts.length > 1 ? `<ul>${v.knockouts.map(k => `<li>${esc(k.reason)}</li>`).join('')}</ul>` : `<p>${esc(v.knockouts[0]?.reason)}</p>`}</div>` : ''}
    <div class="box"><h2>Our suggestion: ${esc(ADVICE[v.recommendation] || 'Look at this one yourself')}</h2><p>${esc(v.summary)}</p></div>
    ${v.score != null ? `<div class="score-line">Overall score: <b>${v.score}</b> out of 100</div>` : ''}
    <div class="actions">
      <button class="btn" type="button" data-step="2">See the details →</button>
      <button class="link grey" type="button" data-step="3">Skip to decision</button>
    </div>`;
}

function details(v) {
  const formRows = Object.entries(v.form || {});
  return `
    ${v.red_flags.length ? `<div class="sec-wrap"><h2 class="sec">Things to watch out for</h2>
      <ul class="check-list">${v.red_flags.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
    ${v.criteria.length ? `<div class="sec-wrap"><h2 class="sec">How they did on our checks</h2>
      <ul class="check-list">${v.criteria.map(c => {
        const [cls, word] = rate(c.score);
        return `<li><div class="mark"><span class="t">${esc(PLAIN_CHECKS[c.id] || c.name)}</span><span class="w ${cls}">${word}</span></div><div class="small">${esc(c.evidence)}</div></li>`;
      }).join('')}</ul></div>` : ''}
    <div class="sec-wrap"><h2 class="sec">What we found online</h2>
      ${v.web_findings.length ? `<ul class="check-list">${v.web_findings.map(f => `<li>${f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.title)}</a>` : `<b>${esc(f.title)}</b>`}<div class="small">${esc(f.takeaway)}</div></li>`).join('')}</ul>`
        : '<p class="small">Nothing about this supplier came up online.</p>'}</div>
    ${formRows.length ? `<div class="sec-wrap"><details><summary>What they told us on the form</summary>
      <dl>${formRows.map(([k, val]) => `<dt>${esc(k)}</dt><dd>${esc(val)}</dd>`).join('')}</dl></details></div>` : ''}
    <div class="actions">
      <button class="btn" type="button" data-step="3">Make your decision →</button>
      <button class="link grey" type="button" data-step="1">Back to summary</button>
    </div>`;
}

function decide(v) {
  if (v.status !== 'pending_review' && !v._reopen) {
    const when = v.decided_at ? new Date(v.decided_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'long' }) : '';
    return `<div class="box" style="margin-top:32px"><h2>${STATUS[v.status]}</h2>
      <p>By ${esc(v.reviewer || 'someone')}${when ? ' on ' + when : ''}.${v.reviewer_note ? `<br>“${esc(v.reviewer_note)}”` : ''}</p></div>
      <div class="actions"><button class="btn light" type="button" data-reopen>Change this decision</button></div>`;
  }
  const ours = ADVICE_TO_CHOICE[v.recommendation];
  const choice = state.choice || ours;
  const options = [
    ['approved', v.blocked ? 'Approve anyway' : 'Approve', v.blocked ? 'Only with written permission from the Head of Procurement.' : 'Add them to our list of suppliers.'],
    ['info_requested', 'Ask for more information', 'We will email them asking for what you write below.'],
    ['rejected', 'Reject', 'We will email them a polite no.'],
  ];
  const box = {
    approved: v.blocked ? ['Who gave permission, and why?', 'Required. This is kept on our records.'] : ['Anything to add?', 'Optional. Only our team sees this.'],
    info_requested: ['What do you need from them?', 'This goes into the email to the supplier.'],
    rejected: ['Reason', 'Optional. Only our team sees this, not the supplier.'],
  }[choice];
  const key = v.vendor_id + choice;
  const text = state.drafts[key] ?? (choice === 'info_requested' && v.questions.length ? v.questions.map(q => '• ' + q).join('\n') : (v._reopen ? v.reviewer_note || '' : ''));

  return `
    <h2 class="sec" style="margin-top:36px">What would you like to do?</h2>
    <div class="choices" role="radiogroup">${options.map(([k, t, d]) => `
      <button type="button" class="choice" role="radio" aria-checked="${choice === k}" data-choice="${k}">
        <span class="dot"></span><span><span class="t">${t}${k === ours ? '<span class="ours">Our suggestion</span>' : ''}</span><span class="d">${d}</span></span>
      </button>`).join('')}</div>
    ${box ? `<div class="write"><label for="note">${box[0]}</label><div class="hint">${box[1]}</div>
      <textarea id="note" data-key="${esc(key)}">${esc(text)}</textarea>
      <label class="tick"><input type="checkbox" id="notify" checked> Email the supplier</label></div>` : ''}
    <div class="err" id="err" role="alert"></div>
    <div class="actions"><button class="btn" type="button" data-confirm ${choice ? '' : 'disabled'}>Confirm</button></div>`;
}

function render() { state.view === 'review' ? renderReview() : renderHome(); }

function go(view, id) {
  Object.assign(state, { view, id: id ?? null, step: 1, choice: null });
  try { history.replaceState(null, '', id ? '#' + encodeURIComponent(id) : location.pathname + location.search); } catch (e) {}
  render();
  window.scrollTo({ top: 0 });
}

/* ======================================================================
   Data
   ====================================================================== */
// n8n serves this page with window.VENDOR_DESK = { base, token, open } filled in.
// Opened as a plain file, the page shows practice data instead.
const LIVE = window.VENDOR_DESK || null;
const apiUrl = path => `${LIVE.base}/${path}?t=${encodeURIComponent(LIVE.token)}`;
const SESSION_ENDED = 'Your session has ended. Please reload the page.';
const blank = v => ({ criteria: [], knockouts: [], red_flags: [], web_findings: [], questions: [], form: {}, ...v });

// Live rows carry the raw form keys; show them with plain labels.
const FORM_LABELS = { offering: 'What they supply', directors: 'Owners', certifications: 'Certificates', cert_expiry: 'Certificate dates',
  capacity: 'Monthly capacity', key_clients: 'Main clients', payment_terms: 'Payment terms', related_party_details: 'Related to anyone at EBM?',
  litigation_details: 'Any court cases or bans?', phone: 'Phone' };
function plainForm(form) {
  const out = {};
  for (const [k, val] of Object.entries(form || {})) if (val && FORM_LABELS[k]) out[FORM_LABELS[k]] = val;
  return out;
}

async function load() {
  state.demo = !LIVE;
  if (state.demo) {
    state.vendors = SAMPLE.map(v => blank({ ...v }));
  } else {
    try {
      // A plain GET with the pass in the link: no custom headers, so no CORS preflight.
      const res = await fetch(apiUrl('vendor-desk/vendors'));
      if (res.status === 401) throw new Error(SESSION_ENDED);
      if (!res.ok) throw new Error('The server replied with an error (' + res.status + ').');
      state.vendors = ((await res.json()).vendors || []).map(v => blank({ ...v, form: plainForm(v.form) }));
    } catch (e) {
      app.innerHTML = `<h1>We couldn't load the suppliers</h1><p class="lead">${esc(e.message)}</p>`;
      return;
    }
  }
  // The approver email links to the page with ?vendor=ID; n8n passes it in as LIVE.open.
  const wanted = (LIVE && LIVE.open) || decodeURIComponent(location.hash.slice(1));
  state.vendors.some(v => v.vendor_id === wanted) ? go('review', wanted) : go('home');
}

async function confirmDecision() {
  const v = state.vendors.find(x => x.vendor_id === state.id);
  const decision = state.choice || ADVICE_TO_CHOICE[v.recommendation];
  const note = ($('#note')?.value || '').trim();
  const notify = $('#notify')?.checked ?? true;
  const err = $('#err');
  if (decision === 'info_requested' && note.replace(/[•\s]/g, '').length === 0) { err.textContent = 'Please write what you need from them.'; return; }
  if (decision === 'approved' && v.blocked && note.length < 20) { err.textContent = 'Please write who gave permission and why. We need this on record.'; return; }
  const reviewer = store.get('name', '');
  if (!reviewer) { openSettings('Please add your name first. It is saved with your decision.'); return; }

  const btn = $('[data-confirm]');
  btn.disabled = true;
  try {
    if (!state.demo) {
      // Form-encoded body: a "simple" request that a sandboxed page can send without a preflight.
      const res = await fetch(apiUrl('vendor-desk/decision'), {
        method: 'POST',
        body: new URLSearchParams({ payload: JSON.stringify({ vendor_id: v.vendor_id, decision, note, reviewer, notify }) }),
      });
      if (res.status === 401) throw new Error(SESSION_ENDED);
      const out = await res.json().catch(() => ({}));
      if (!res.ok || out.ok === false) throw new Error(out.error || 'the server replied with an error');
    }
    Object.assign(v, { status: decision, reviewer, decided_at: new Date().toISOString(), _reopen: false,
      reviewer_note: v.blocked && decision === 'approved' ? '[Exception] ' + note : note });
    const next = waiting()[0];
    toast(`Done. ${v.company_name}: ${STATUS[decision].toLowerCase()}.${next ? ' Here is the next one.' : ''}`);
    next ? go('review', next.vendor_id) : go('home');
  } catch (e) {
    err.textContent = 'This was not saved: ' + e.message + '. Please try again.';
    btn.disabled = false;
  }
}

/* ======================================================================
   Events
   ====================================================================== */
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('show'), 4000);
}

function openSettings(hint) {
  $('#sName').value = store.get('name', '');
  $('#settingsHint').textContent = hint || 'Your name is saved with every decision you make.';
  $('#settings').showModal();
  $('#sName').focus();
}

// Saving a name keeps the reviewer exactly where they were.
$('#settingsForm').addEventListener('submit', () => store.set('name', $('#sName').value.trim()));

document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  const v = state.vendors.find(x => x.vendor_id === state.id);
  if (t.matches('[data-home]')) go('home');
  else if (t.matches('[data-settings]')) openSettings();
  else if (t.matches('[data-toggle-done]')) { state.showDone = !state.showDone; render(); }
  else if (t.dataset.open) go('review', t.dataset.open);
  else if (t.dataset.step) { state.step = Number(t.dataset.step); render(); window.scrollTo({ top: 0 }); }
  else if (t.dataset.choice) { state.choice = t.dataset.choice; render(); }
  else if (t.matches('[data-reopen]')) { v._reopen = true; state.choice = v.status; render(); }
  else if (t.matches('[data-confirm]')) confirmDecision();
});
document.addEventListener('input', e => {
  if (e.target.id === 'note') state.drafts[e.target.dataset.key] = e.target.value;
});

load();
</script>
</body>
</html>
